<style>
  :root {
    --ink:#14110C; --ink-2:#1E1A13; --cream:#F5F0E3; --gold-1:#FACE5C; --gold-2:#E0A230; --gold-3:#C17301;
    --taupe:#A3988A; --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Inter",ui-sans-serif,system-ui,sans-serif;
    --ease-out: cubic-bezier(0.16,1,0.3,1); --gutter: clamp(20px,4vw,48px);
  }
  *,*::before,*::after { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; background:var(--ink); color:var(--cream); font-family:var(--body); font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
    background-image: radial-gradient(90% 60% at 80% 0%, rgba(224,162,48,0.14), transparent 60%); }
  ::selection { background:var(--gold-2); color:var(--ink); }
  a { color:var(--gold-1); text-decoration-thickness:1px; text-underline-offset:3px; }
  a:hover { color:var(--cream); }
  :focus-visible { outline:2px solid var(--gold-2); outline-offset:4px; border-radius:2px; }
  .shell { width:100%; max-width:760px; margin-inline:auto; padding-inline:var(--gutter); }
  .nav { padding-block:18px; }
  .brand { display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:var(--cream); }
  .brand img { width:34px; height:auto; display:block; }
  .wordmark { font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:0.14em; text-transform:uppercase; line-height:1; transform:translateY(1px); }
  main { padding-block: clamp(56px,9vw,110px) clamp(72px,10vw,120px); }
  .eyebrow { font-size:11.5px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold-2); margin:0 0 18px; }
  h1 { font-family:var(--display); font-weight:500; letter-spacing:-0.03em; line-height:1.05; font-size:clamp(2.1rem,5vw,3.4rem); margin:0 0 14px; text-wrap:balance; }
  h1 em { font-style:normal; color:var(--gold-1); }
  h2 { font-family:var(--display); font-weight:500; letter-spacing:-0.02em; line-height:1.2; font-size:clamp(1.25rem,2.4vw,1.55rem); margin:44px 0 10px; }
  p { margin:0 0 16px; }
  .lede { font-size:1.1rem; line-height:1.7; color:rgba(245,240,227,0.78); max-width:60ch; }
  .muted { color:var(--taupe); font-size:14px; }
  .terms p, .terms li { color:rgba(245,240,227,0.86); max-width:64ch; }
  .btn { display:inline-block; font-family:var(--display); font-weight:600; font-size:15px; color:var(--ink); text-decoration:none;
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 100%); border-radius:6px; padding:14px 22px; margin-top:8px;
    box-shadow:0 10px 30px -14px rgba(224,162,48,0.55); transition:transform 220ms var(--ease-out), box-shadow 220ms ease; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 16px 34px -14px rgba(224,162,48,0.7); color:var(--ink); }
  .ghost { display:inline-block; font-family:var(--display); font-weight:500; font-size:15px; color:var(--cream); text-decoration:none;
    border:1px solid rgba(245,240,227,0.22); border-radius:6px; padding:13px 20px; margin:8px 0 0 10px; transition:border-color 220ms ease; }
  .ghost:hover { border-color:var(--gold-2); color:var(--cream); }
  .card { background:rgba(30,26,19,0.62); border:1px solid rgba(245,240,227,0.08); border-top:2px solid var(--gold-2); border-radius:10px; padding:30px; margin-top:36px; }
  .rule { height:1px; background:linear-gradient(90deg,var(--gold-2),rgba(224,162,48,0.15) 60%,transparent); margin:28px 0 8px; }
  footer { border-top:1px solid rgba(245,240,227,0.08); padding-block:28px; color:var(--taupe); font-size:13.5px; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .in { opacity:0; transform:translateY(18px); animation:rise 900ms var(--ease-out) forwards; }
  .in.d1 { animation-delay:120ms; } .in.d2 { animation-delay:240ms; }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .in { animation:none; opacity:1; transform:none; } }
</style>
