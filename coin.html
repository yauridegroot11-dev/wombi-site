<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wombi</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://wombi.store/">
<link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<!-- Without JavaScript, still get people to the site. -->
<meta http-equiv="refresh" content="3; url=/">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #F5F0E3; color: #14110C;
    font: 500 17px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: inherit; }
</style>
</head>
<body>
<p><a href="/">Hop, hop. Taking you to Wombi…</a></p>
<script>
  /* ------------------------------------------------------------
     The QR on the mini roo figurines opens wombi.store/roo. Count the
     scan in the qr_scans table of the Wombi Supabase project, then
     forward. A copy of this file named roo-<event>.html counts under
     its own code, so each event can get its own QR.
     Like beta.html, it posts straight to the REST API with the
     publishable key; qr_scans lets that key insert a scan and nothing
     else, so it can never read the counts back.
  ------------------------------------------------------------ */
  const SUPABASE_URL = 'https://lxsvgadyswifsnhcbayq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5gG_hfA0AkxSuhH0QEWzPQ_r3KgZVEG';
  const DESTINATION = '/';
  const PREVIEW = /claude\.ai$|claudeusercontent|localhost|^file:/.test(location.hostname + location.protocol);

  const code = location.pathname.replace(/^\/+|\.html$|\/+$/g, '').toLowerCase()
    .replace(/[^a-z0-9-]/g, '-').slice(0, 40) || 'roo';
  const ua = navigator.userAgent;
  const platform = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios'
    : /Android/.test(ua) ? 'android'
    : /Macintosh/.test(ua) ? 'mac'
    : 'other';

  const go = () => location.replace(DESTINATION);
  if (PREVIEW) {
    go();
  } else {
    // A slow network should not keep someone staring at this page.
    const counted = fetch(`${SUPABASE_URL}/rest/v1/qr_scans`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ code, platform }),
    }).catch(() => {});
    Promise.race([counted, new Promise(r => setTimeout(r, 800))]).then(go);
  }
</script>
</body>
</html>
